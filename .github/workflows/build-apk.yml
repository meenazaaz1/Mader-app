name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Prepare Project
        run: |
          # ลบ pubspec.yaml เก่าทิ้ง แล้วให้ flutter สร้างโปรเจกต์ใหม่ที่ถูกต้องให้ทั้งหมดอัตโนมัติ
          rm -f pubspec.yaml
          flutter create . --org com.example --project-name mader_app --platforms=android
          
          # ย้ายไฟล์โค้ด main.dart ไปไว้ในโฟลเดอร์ lib ที่สร้างขึ้น
          mkdir -p lib
          if [ -f "Main.dart" ]; then mv Main.dart lib/main.dart; fi
          if [ -f "main.dart" ]; then mv main.dart lib/main.dart; fi

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
